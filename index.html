 const e=await sb.rpc('platform_review_payment',{p_id:id,p_ok:!!ok,p_note:note});toast(e.error?needPlat(e.error.message):(ok?'Pembayaran disetujui ✔':'Pembayaran ditolak'));devRefresh()}

 main().innerHTML='<h2>Pengaturan Langganan</h2><p class=m>Memuat…</p>';const[{data:pl,error},{data:ps}]=await Promise.all([sb.from('plans').select('*').order('months'),sb.from('platform_settings').select('*')]);
 if(error){main().innerHTML='<h2>Pengaturan Langganan</h2><p class=m>'+esc(needPlat(error.message))+'</p>';return}

 if(m=='piutang')await sb.from('receivables').insert({trx_id:t.id,customer:cu,total:tot,paid:dp,due_date:due});

function paintNota(g,t,items,img,W){const P=22,F='system-ui,-apple-system,Segoe UI,Roboto,sans-serif',st=outletOf(t.branch_id).name,pm={tunai:'Tunai',qris:'QRIS',piutang:'Piutang'}[t.method]||String(t.method||''),hd=cfg.receipt_header?cfg.receipt_header.split('|').map(x=>x.trim()).filter(Boolean):[];let y=P;
 const tx=(s,x,al,f,c)=>{g.font=f;g.fillStyle=c||'#111';g.textAlign=al;g.fillText(s,x,y)},
 wrap=(s,f,mx)=>{g.font=f;const o=[];let l='';String(s).split(' ').forEach(w=>{const k=l?l+' '+w:w;if(l&&g.measureText(k).width>mx){o.push(l);l=w}else l=k});if(l)o.push(l);return o},
 ln=()=>{g.strokeStyle='#222';g.lineWidth=1.5;g.setLineDash([5,4]);g.beginPath();g.moveTo(P,y);g.lineTo(W-P,y);g.stroke();g.setLineDash([]);y+=22},
 row=(a,b,f)=>{tx(a,P,'left',f);tx(b,W-P,'right',f);y+=25};
 g.fillStyle='#fff';g.fillRect(0,0,W,4000);
 if(img){const k=Math.min(80/img.height,(W-2*P)/img.width),w=img.width*k,h=img.height*k;g.drawImage(img,(W-w)/2,y,w,h);y+=h+10}
 y+=22;wrap(st,'bold 22px '+F,W-2*P).forEach(l=>{tx(l,W/2,'center','bold 22px '+F);y+=27});
 hd.forEach(l=>{tx(l,W/2,'center','14px '+F);y+=20});y+=4;ln();
 row(new Date(t.created_at).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\./g,':').replace(',',''),t.cashier||'','15px '+F);tx(t.trx,P,'left','15px '+F);y+=12;ln();
 items.forEach(i=>{wrap(i.name,'16px '+F,W-2*P).forEach(l=>{tx(l,P,'left','16px '+F);y+=22});row(i.qty+' x '+rp(i.price),rp(i.qty*i.price),'15px '+F)});y-=4;ln();
 if(+t.discount>0)row('Diskon','-'+rp(t.discount),'15px '+F);

 const r=id?await sb.from('products').update(o).eq('id',id).select().single():await sb.from('products').insert(o).select().single();if(r.error)return toast(r.error.code=='23505'?'Produk dengan nama itu sudah ada':r.error.message);
 await sb.from('product_ingredients').delete().eq('product_id',r.data.id);const rows=rcp.filter(x=>x.ingredient_id&&+x.qty>0).map(x=>({product_id:r.data.id,ingredient_id:x.ingredient_id,qty:+x.qty}));if(rows.length)await sb.from('product_ingredients').insert(rows);if(me.branch_id&&q!=null){await sb.from('branch_stock').upsert({branch_key:me.branch_id,kind:'produk',item_id:r.data.id,qty:q});if(r.data.stock==null)await sb.from('products').update({stock:0}).eq('id',r.data.id)}closeM();V.produk()}

 const un=r[1].toLowerCase().replace(/[^a-z0-9._-]/g,'');if(!r[0]||!un)return toast('Nama dan username wajib diisi');if(r[2].length<6)return toast('Password minimal 6 karakter');

V.shift=async()=>{await loadShift();

 const k=await cashStats();

 <div class=card><div class=row><span style="flex:1">Kas awal</span><b>${rp(k.open)}</b></div><div class=row><span style="flex:1">+ Penjualan tunai</span><b>${rp(k.tun)}</b></div><div class=row><span style="flex:1">− Pengeluaran tunai</span><b>${rp(k.ex)}</b></div><div class=row style="border-top:1px dashed var(--b);padding-top:8px;margin-top:6px"><b style="flex:1">Kas seharusnya</b><b>${rp(k.exp)}</b></div></div>
 <div class=card><small>Hitung uang tunai di laci, lalu isi jumlahnya. Wajib diisi untuk menutup kasir.</small><input id=cc type=number inputmode=decimal placeholder="Uang cash di laci (Rp) *" oninput="selDraw(${k.exp})"><div id=sel></div><button class=btn onclick=closeS()>Tutup kasir</button></div>

function selDraw(exp){const v=$('#cc').value;$('#sel').innerHTML=v===''?'':(+v==exp?'<p style="color:#16a34a;font-weight:700">✔ Kas sesuai</p>':`<p style="color:#dc2626;font-weight:700">Selisih ${+v>exp?'lebih ':'kurang '}${rp(Math.abs(+v-exp))}</p>`)}
async function openS(){if(busy)return;busy=true;await openShift(+$('#oc').value||0);busy=false;V.shift()}
async function cashStats(){if(!shift)return null;if(!ONL()){const c=JSON.parse(localStorage.offcs||'null'),q=oq().filter(e=>e.by===me.id&&e.rec.created_at>=shift.opened_at),tun=(c&&c.sid==shift.id?c.tun:0)+sum(q.filter(e=>e.rec.method=='tunai'),e=>e.rec.total)+sum(q.filter(e=>e.rec.method=='piutang'),e=>e.dp),ex=c&&c.sid==shift.id?c.ex:0,open=+shift.open_cash||0;return{open,tun,ex,exp:open+tun-ex}}const[{data:t},{data:e},{data:rpay}]=await Promise.all([sb.from('transactions').select('total,paid,method').eq('cashier_id',me.id).gte('created_at',shift.opened_at),sb.from('expenses').select('amount,method').eq('by_id',me.id).gte('created_at',shift.opened_at),sb.from('receivable_payments').select('amount,method').eq('by_id',me.id).gte('created_at',shift.opened_at)]);
 const tun=sum((t||[]).filter(x=>x.method=='tunai'),x=>x.total)+sum((t||[]).filter(x=>x.method=='piutang'),x=>x.paid)+sum((rpay||[]).filter(x=>x.method=='tunai'),x=>x.amount),ex=sum((e||[]).filter(x=>x.method!='non'),x=>x.amount),open=+shift.open_cash||0;try{localStorage.offcs=JSON.stringify({sid:shift.id,tun,ex})}catch(x){}return{open,tun,ex,exp:open+tun-ex}}
async function dayStats(since){const{data:t}=await sb.from('transactions').select('id,total,discount').eq('cashier_id',me.id).gte('created_at',since),ids=(t||[]).map(x=>x.id),it=ids.length?(await sb.from('transaction_items').select('price,cost,qty').in('trx_id',ids)).data:[],{data:e}=await sb.from('expenses').select('amount').eq('by_id',me.id).gte('created_at',since);
 const om=sum(t,x=>x.total),laba=sum(it,i=>(i.price-i.cost)*i.qty)-sum(t,x=>x.discount),ex=sum(e,x=>x.amount);return{om,n:(t||[]).length,laba,ex,net:laba-ex}}
async function closeS(){if(busy)return;const v=$('#cc').value;if(v==='')return toast('Uang cash wajib diisi');const c=+v,k=await cashStats(),diff=c-k.exp;
 const r=await dlg({t:diff?'Ada selisih kas':'Tutup kasir?',m:diff?`Uang di laci ${diff>0?'lebih':'kurang'} ${rp(Math.abs(diff))} dari seharusnya (${rp(k.exp)}). ${diff<0?'Kekurangan dicatat sebagai setoran kurang dan memotong gaji pokok. ':''}Tulis alasan selisih.`:'Kas sesuai dengan penjualan dan pengeluaran. Tutup kasir sekarang?',ic:'wallet',danger:!!diff,f:diff?[{l:'Alasan selisih (wajib)',ph:'Contoh: salah kembalian'}]:[],ok:'Tutup kasir'});
 if(!r)return;if(diff&&!r[0])return toast('Alasan selisih wajib diisi');if(!ONL())return closeOff(c,k,diff,r);busy=true;const st=await dayStats(shift.opened_at),closed=iso(new Date());
 let e=await sb.from('shifts').update({close_cash:c,closed_at:closed,expected_cash:k.exp,cash_sales:k.tun,cash_expenses:k.ex,diff,note:diff?r[0]:null}).eq('cashier_id',me.id).is('closed_at',null);
 if(e.error){e=await sb.from('shifts').update({close_cash:c,closed_at:closed}).eq('cashier_id',me.id).is('closed_at',null);if(!e.error)toast('Kasir ditutup. Jalankan pengeluaran.sql agar selisih kas tersimpan')}
 busy=false;if(e.error)return toast(e.error.message);shift=null;
 const R=(l,v,b)=>`<div class=row style="margin:4px 0"><span style="flex:1">${l}</span>${b?`<b>${v}</b>`:`<span>${v}</span>`}</div>`;
 modal(`<h3>Kasir ditutup ✔</h3><div class=card>${R('Omzet ('+st.n+' transaksi)',rp(st.om))}${R('Laba',rp(st.laba))}${R('Pengeluaran','− '+rp(st.ex))}${R('Laba bersih',rp(st.net),1)}</div><div class=card>${R('Kas seharusnya',rp(k.exp))}${R('Uang di laci',rp(c))}${R('Selisih',(diff>0?'+':'')+rp(diff),1)}</div><button class=btn onclick="closeM();go('beranda')">Selesai</button>`)}

const xN=v=>{if(typeof v=='number')return v;let x=String(v).trim().replace(/[^\d.,-]/g,'');if(!x)return NaN;if(x.includes(',')&&x.includes('.'))x=x.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,'');else x=x.replace(',','.');return +x};

 modal(`<h3>Pratinjau impor ${P.title}</h3><div class=card>${P.lines.map(l=>`<div class=row><span style="flex:1">${esc(l[0])}</span><b>${l[1]}</b></div>`).join('')}</div>${['jual','biaya'].includes(k)?`<small>Cabang tujuan</small><select id=xb><option value="">${esc(HQ())}</option>${brs.map(c=>`<option value="${c.id}" ${c.id==me.branch_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}<small>${esc(P.note)}</small>${P.err.length?`<div class=card style="border-color:#dc2626"><b style="color:#dc2626">${P.err.length} baris dilewati</b>${P.err.slice(0,8).map(e=>`<br><small>${esc(e)}</small>`).join('')}${P.err.length>8?'<br><small>…</small>':''}</div>`:''}${P.n?`<button class=btn onclick="xrun()">Impor ${P.n} data</button>`:'<p class=m>Tidak ada data yang bisa diimpor.</p>'}<button class="btn ghost" onclick=closeM()>Batal</button>`)}
async function xrun(){if(busy)return;busy=true;const P=XI.plan;let ok=0,bad=0;try{
 if(XI.k=='prod'){const nw=P.items.filter(p=>!xex(p)),up=P.items.filter(p=>xex(p)),tr=p=>!isNaN(p.stock),bs=[];
  for(let i=0;i<nw.length;i+=100){const ch=nw.slice(i,i+100),r=await sb.from('products').insert(ch.map(p=>({name:p.nm,sku:p.sku,category:p.cat||'Umum',price:p.pr,cost:isNaN(p.cost)?null:p.cost,stock:tr(p)?0:null,min_stock:isNaN(p.min)?null:p.min}))).select('id,name');if(r.error){bad+=ch.length;continue}ok+=ch.length;if(me.branch_id)(r.data||[]).forEach(d=>{const p=ch.find(x=>x.nm.toLowerCase()==d.name.trim().toLowerCase());if(p&&tr(p))bs.push({branch_key:me.branch_id,kind:'produk',item_id:d.id,qty:p.stock})})}
  for(const p of up){const e=xex(p),o={price:p.pr};if(p.cat)o.category=p.cat;if(!isNaN(p.cost))o.cost=p.cost;if(p.sku)o.sku=p.sku;if(!isNaN(p.min))o.min_stock=p.min;const r=await sb.from('products').update(o).eq('id',e.id);if(r.error){bad++;continue}ok++;if(me.branch_id&&tr(p)){bs.push({branch_key:me.branch_id,kind:'produk',item_id:e.id,qty:p.stock});if(e.stock==null)await sb.from('products').update({stock:0}).eq('id',e.id)}}
  if(bs.length)await sb.from('branch_stock').upsert(bs);await loadProds()}
 else if(XI.k=='jual'){const bid=($('#xb')||{}).value||null;await loadProds();
  for(let i=0;i<P.groups.length;i+=50){const ch=P.groups.slice(i,i+50).map(g=>{const st=sum(g.items,x=>x.price*x.qty);return{g,row:{trx:g.no||('IMP'+ymd(g.d).replace(/-/g,'').slice(2)+Math.random().toString(36).slice(2,7).toUpperCase()),cashier_id:me.id,cashier:g.cashier||me.name,branch_id:bid,subtotal:st,discount:g.disc,total:st-g.disc,method:['tunai','qris'].includes(g.method)?g.method:'tunai',paid:st-g.disc,change:0,customer:g.cust||null,created_at:iso(g.d)}}}),r=await sb.from('transactions').insert(ch.map(c=>c.row)).select('id,trx');if(r.error){bad+=ch.length;continue}const idm={};(r.data||[]).forEach(d=>idm[d.trx]=d.id);const its=[];ch.forEach(c=>c.g.items.forEach(x=>its.push({trx_id:idm[c.row.trx],product_id:(prods.find(p=>p.name.trim().toLowerCase()==x.name.toLowerCase())||{}).id||null,name:x.name,price:x.price,cost:x.cost,qty:x.qty})));const ri=await sb.from('transaction_items').insert(its);if(ri.error)bad+=ch.length;else ok+=ch.length}}
 else if(XI.k=='bahan'){const ing=XI.ing,bs=[];for(const p of P.items){const e=ing.find(x=>x.name.trim().toLowerCase()==p.nm.toLowerCase()),o={unit:p.unit};if(!isNaN(p.min))o.min_stock=p.min;let id=e&&e.id;if(e){const r=await sb.from('ingredients').update(o).eq('id',id);if(r.error){bad++;continue}}else{const r=await sb.from('ingredients').insert({name:p.nm,...o}).select('id').single();if(r.error){bad++;continue}id=r.data.id}ok++;if(me.branch_id&&!isNaN(p.stock))bs.push({branch_key:me.branch_id,kind:'bahan',item_id:id,qty:p.stock})}if(bs.length)await sb.from('branch_stock').upsert(bs)}
 else if(XI.k=='biaya'){const bid=($('#xb')||{}).value||null;for(let i=0;i<P.items.length;i+=100){const ch=P.items.slice(i,i+100),r=await sb.from('expenses').insert(ch.map(x=>({amount:x.a,category:x.cat,note:x.note||null,method:x.method,by_id:me.id,by_name:me.name,branch_id:bid,created_at:iso(x.d)})));r.error?bad+=ch.length:ok+=ch.length}}
 else{for(const u of P.rows){const r=await sb.from('profiles').update(u.o).eq('id',u.id);r.error?bad++:ok++}}
 closeM();toast(ok+' data diimpor ✔'+(bad?' · '+bad+' gagal':''))}catch(e){toast(e.message)}finally{busy=false}}

 if(dip){dip.prompt();await dip.userChoice;dip=null;return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);dlg({t:'Pasang KasirKu',m:ios?'Di Safari: ketuk tombol Bagikan (kotak dengan panah), lalu pilih "Tambah ke Layar Utama".':'Di Chrome: ketuk menu titik tiga (⋮) di kanan atas, lalu pilih "Pasang aplikasi" atau "Tambahkan ke layar utama".',ic:'download',ok:'Mengerti'})}

async function loadShift(){XSt=0;if(!ONL()){opTick();return shift}const r=await sb.from('shifts').select('*').eq('cashier_id',me.id).is('closed_at',null).order('opened_at',{ascending:true}).limit(1);if(r.error&&netErr(r.error)){opTick();return shift}shift=r.data&&r.data[0]||null;if(!shift&&ops().some(x=>x.t=='open'&&x.by===me.id)&&!ops().some(x=>x.t=='close'&&x.by===me.id))shift=(JSON.parse(localStorage.offme||'{}').shift)||null;opTick();return shift}
async function openShift(cash){const ex=await loadShift();if(ex)return ex;if(!ONL())return openShiftOff(cash);const{data,error}=await sb.from('shifts').insert({cashier_id:me.id,cashier:me.name,open_cash:cash}).select().single();if(error){toast(error.message);return null}shift=data;return data}
async function bukaKasir(){if(shift)return go('shift');const r=await dlg({t:'Buka kasir',m:'Masukkan uang kas awal yang ada di laci kasir.',ic:'wallet',f:[{l:'Kas awal (Rp)',type:'number',ph:'0'}],ok:'Buka kasir'});if(!r||busy)return;busy=true;const had=await loadShift(),s0=had||await openShift(+r[0]||0);busy=false;if(!s0)return;toast(had?'Kasir sudah dibuka sebelumnya ✔':'Kasir dibuka ✔');closeM();if(tab=='kasir')V.kasir();else go('kasir')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)loadShift().then(()=>{if(tab=='beranda')V.beranda()})});

V.setelan=async()=>{if(!biz)biz=(await sb.from('businesses').select('*').maybeSingle()).data;const wd=(cfg.workdays||'0,1,2,3,4,5,6').split(',');
 main().innerHTML=`<h2>Setelan</h2>${PLAT?`<div class=card><b>Konsol Developer</b><br><small>Atur langganan dan kirim pengumuman lewat tampilan khusus developer.</small><button class=btn onclick="devSwitch(true)">Buka Konsol Developer</button></div>`:''}
 <div class=card><b>Nama outlet pusat</b><br><small>Menggantikan kata "Pusat" di seluruh aplikasi, termasuk kiriman barang dan laporan.</small><input id=hq value="${esc(HQ())}" placeholder="Pusat"><button class=btn onclick="hqSet($('#hq').value)">Simpan</button></div>
 <div class=card><b>Nama bisnis / toko</b><input id=sn value="${esc(cfg.store||(biz&&biz.name)||'')}" placeholder="Nama toko"><button class=btn onclick="saveStore()">Simpan</button></div>
 <div class=card><b>Jam operasional</b><br><small>Di luar jam ini kasir tidak bisa transaksi. Saat jam tutup kasir wajib tutup kasir, dan 30 menit sebelumnya muncul peringatan. Boleh melewati tengah malam, misalnya 21:00 sampai 02:00. Admin tidak dibatasi.</small><div class=pt style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="${cfg.op_on==='1'?'on':''}" onclick="opSet('op_on','1')">Aktif</button><button class="${cfg.op_on!=='1'?'on':''}" onclick="opSet('op_on','0')">Nonaktif</button></div><div class=row style="margin-top:8px"><div style="flex:1"><small>Jam buka</small><input id=opo type=time value="${esc(cfg.op_open||'08:00')}"></div><div style="flex:1"><small>Jam tutup</small><input id=opc type=time value="${esc(cfg.op_close||'22:00')}"></div></div><button class=btn onclick="opSave()">Simpan jam operasional</button></div>
 <div class=card><b>Aturan kasir</b><small>Pesanan ditahan dan piutang dari shift ini harus dibayar dulu sebelum transaksi baru.</small><div class=pt style="grid-template-columns:1fr 1fr"><button class="${cfg.force_pending!=='0'?'on':''}" onclick="setCfg('force_pending','1').then(()=>V.setelan())">Wajib bayar dulu</button><button class="${cfg.force_pending==='0'?'on':''}" onclick="setCfg('force_pending','0').then(()=>V.setelan())">Boleh transaksi baru</button></div></div>
 <div class=card><b>Kode bisnis</b><p class=m style="margin:4px 0 8px">Bagikan kode ini ke karyawan agar bisa mendaftar lewat menu "Gabung" di halaman login. Akun baru menunggu persetujuan Anda di menu Tim.</p><div class=row><input readonly value="${esc((biz&&biz.code)||'-')}" style="font-weight:800;letter-spacing:.2em;text-align:center"><button class="btn ghost" style="width:auto" onclick="copyCode()">Salin</button></div></div>
 <div class=card><b>Aturan absensi & denda</b><br><small>Hanya Admin yang bisa mengubah ini.</small>
  <label class=fl>Batas jam absen masuk</label><input id=ai type=time value="${esc(cfg.att_in||'')}">
  <label class=fl>Toleransi keterlambatan (menit)</label><input id=at type=number inputmode=numeric value="${esc(cfg.att_tol||'')}" placeholder="0">
  <label class=fl>Denda terlambat (Rp per hari)</label><input id=fl type=number inputmode=numeric value="${esc(cfg.fine_late||'')}" placeholder="0">
  <label class=fl>Denda tidak masuk (Rp per hari kerja)</label><input id=fa type=number inputmode=numeric value="${esc(cfg.fine_absent||'')}" placeholder="0">
  <label class=fl>Denda tidak absen pulang (Rp per hari)</label><input id=fn type=number inputmode=numeric value="${esc(cfg.fine_nopulang||'')}" placeholder="0">
  <label class=fl>Hari kerja</label><div class=chips style="flex-wrap:wrap">${[['Sen',1],['Sel',2],['Rab',3],['Kam',4],['Jum',5],['Sab',6],['Min',0]].map(([l,d])=>`<button class="chip wdb ${wd.includes(String(d))?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${l}</button>`).join('')}</div>
  <label class=fl>Denda tidak masuk berlaku mulai tanggal</label><input id=fs type=date value="${esc(cfg.fine_start||ymd(new Date()))}">
  <button class=btn onclick="saveAtt()">Simpan aturan</button></div>
 <div class=card><b>Warna tema</b><div class=chips>${Object.entries(THEMES).map(([n,c])=>`<button class=chip style="border-color:${c};color:${c}" onclick="theme('${c}')">${n}</button>`).join('')}</div><button class="btn ghost" onclick="localStorage.dk=localStorage.dk=='on'?'off':'on';theme()">Mode gelap / terang</button></div>
 <div class=card><b>QRIS statis</b><br>${cfg.qris?`<img src="${cfg.qris}" style="width:160px">`:''}<input id=qf type=file accept=image/*><button class=btn onclick=upQ()>Upload QRIS</button></div>
 <div class=card><b>Logo bisnis</b><br><small>Dipakai sebagai logo nota jika sebuah outlet belum punya logo sendiri, dan sebagai watermark absensi. Logo tiap outlet diatur di Tim &amp; Cabang (ikon gambar).</small><br>${cfg.logo?`<img src="${cfg.logo}" style="height:70px">`:''}<input id=lf type=file accept=image/*><button class=btn onclick=upL()>Upload logo</button></div>
 <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button>`}
async function saveStore(){const v=$('#sn').value.trim();if(!v)return toast('Nama wajib diisi');await setCfg('store',v);if(biz)await sb.from('businesses').update({name:v}).eq('id',biz.id)}
function copyCode(){if(!biz)return;navigator.clipboard&&navigator.clipboard.writeText(biz.code);toast('Kode disalin ✔')}
async function saveAtt(){const wd=[...document.querySelectorAll('.wdb.on')].map(b=>b.dataset.d).join(','),o={att_in:$('#ai').value,att_tol:$('#at').value||'0',fine_late:$('#fl').value||'0',fine_absent:$('#fa').value||'0',fine_nopulang:$('#fn').value||'0',workdays:wd,fine_start:$('#fs').value};const rows=Object.entries(o).map(([key,value])=>({key,value:String(value)})),r=await sb.from('settings').upsert(rows,{onConflict:'business_id,key'});if(r.error)return toast(r.error.message);Object.assign(cfg,o);toast('Aturan absensi tersimpan ✔')}
async function setCfg(k,v){cfg[k]=v;const r=await sb.from('settings').upsert({key:k,value:v},{onConflict:'business_id,key'});toast(r.error?r.error.message:'Tersimpan')}
async function upL(){const f=$('#lf').files[0];if(!f)return toast('Pilih gambar logo');const u=await up(f,'logo');if(u){await setCfg('logo',u);V.setelan()}}
async function upQ(){const f=$('#qf').files[0];if(!f)return toast('Pilih gambar QRIS');const u=await up(f,'qris');if(u){await setCfg('qris',u);V.setelan()}}
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
